[package]
name = "herdr-session-transfer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
txcript = { version = "0.14.4", default-features = false }
uuid = { version = "1.29.2", features = ["v4", "v7"] }
